apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-product-release-note-qa-copilot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GurkeSchaleSammler/homelab-helm.git
    targetRevision: 30def363cc0c3c288adc758be1827523a40039c3
    path: charts/ai-products/release-note-qa-copilot
    helm:
      releaseName: release-note-qa-copilot
      valueFiles: [values.yaml, values-factory.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-product-release-note-qa-copilot
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
