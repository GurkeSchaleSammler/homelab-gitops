apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-product-rechnungs-abgleich-radar
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GurkeSchaleSammler/homelab-helm.git
    targetRevision: 30def363cc0c3c288adc758be1827523a40039c3
    path: charts/ai-products/rechnungs-abgleich-radar
    helm:
      releaseName: rechnungs-abgleich-radar
      valueFiles: [values.yaml, values-factory.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-product-rechnungs-abgleich-radar
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
