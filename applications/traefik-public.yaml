apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-public
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "41.5.0"

    helm:
      valuesObject:
        ingressClass:
          enabled: true
          isDefaultClass: false
          name: traefik-public

        providers:
          kubernetesCRD:
            enabled: true
            ingressClass: traefik-public
          kubernetesIngress:
            enabled: true
            ingressClass: traefik-public

        service:
          type: LoadBalancer
          annotations:
            metallb.io/address-pool: public-ingress
            metallb.io/loadBalancerIPs: 192.168.0.240
          spec:
            # Future dual-stack values: docs/dual-stack/traefik-public.values.yaml
            ipFamilyPolicy: SingleStack
            ipFamilies:
              - IPv4

        deployment:
          replicas: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik-public

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
