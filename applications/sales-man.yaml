apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sales-man
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/GurkeSchaleSammler/homelab-helm.git
    targetRevision: main
    path: charts/ai-products/sales-man
    helm:
      releaseName: sales-man
      valuesObject:
        replicaCount: 0
        image:
          repository: ghcr.io/gurkeschalesammler/ai-product-factory-sales-man
          digest: sha256:3019dca9ed47432b1c866d30b428497c05140382f1cb23896752836d5ea5a844
        imagePullSecrets:
          - name: ghcr-sales-man
        config:
          llmBaseUrl: https://api.deepseek.com
          llmModel: deepseek-flash
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-product-factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
