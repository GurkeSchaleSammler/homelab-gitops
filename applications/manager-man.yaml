apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: manager-man
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/GurkeSchaleSammler/homelab-helm.git
    targetRevision: main
    path: charts/ai-products/manager-man
    helm:
      releaseName: manager-man
      valuesObject:
        image:
          repository: ghcr.io/gurkeschalesammler/ai-product-factory-manager-man
          digest: sha256:7c4ec2b255546cbc722cb17a092d84be3b59ed5992847a3b5ba9b729bbcf513c
        imagePullSecrets:
          - name: ghcr-manager-man
        migration:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-product-factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
