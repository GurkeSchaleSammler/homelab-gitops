apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: innovation-man
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/GurkeSchaleSammler/homelab-helm.git
    targetRevision: main
    path: charts/ai-products/innovation-man
    helm:
      releaseName: innovation-man
      valuesObject:
        schedule: "*/30 * * * *"
        suspend: true
        image:
          repository: ghcr.io/gurkeschalesammler/ai-product-factory-innovation-man
          digest: sha256:ddba27c769525325e8a912e368cd4e74dd8e48068d43c4e18447327d47750991
        imagePullSecrets:
          - name: ghcr-innovation-man
        config:
          llmBaseUrl: https://api.deepseek.com
          llmModel: deepseek-flash
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-product-factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
