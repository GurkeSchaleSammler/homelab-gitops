apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: argocd-public
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: traefik-public
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`argocd.gurkeschale.ch`)
      services:
        - name: argocd-server
          port: 443
  tls:
    passthrough: true
